{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    {% block title %} {% endblock %}
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'main/css/main.css' %}">
</head>
<body class="bg-light">

  {% include 'main/nav.html' %}

  <div class="container my-4">
    <div class="row">
      <aside class="col-md-3 mb-4">
        <div class="bg-white p-3 rounded shadow text-center">
          <img src="{% static 'main/images/cat.jpg' %}" alt="кошка" class="img-fluid rounded-circle mb-2" width="100">
          <div class="fw-bold text-primary mb-2">{{caption}}</div>
          <ul class="list-group">
            <li class="list-group-item"><a class="text-decoration-none" href="{% url 'home' %}">Главная</a></li>
            <li class="list-group-item"><a class="text-decoration-none" href="{% url 'page2' %}">Каталог</a></li>
            <li class="list-group-item"><a class="text-decoration-none" href="{% url 'page3' %}">Блог</a></li>
            <li class="list-group-item"><a class="text-decoration-none" href="{% url 'page4' %}">О сайте</a></li>
          </ul>
        </div>
      </aside>
      <main class="col-md-9">
        {% block content %}
          {% endblock %}
      </main>
    </div>
  </div>

  {% include 'main/footer.html' %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
